<div class="login-page d-flex align-items-center justify-content-center">
  <div class="login-card text-center">
    <div class="login-logo">Librería Nazareth</div>
    <div class="login-subtitle">Sistema de gestión</div>

    @if (errorMessage) {
      <div class="alert alert-error">{{ errorMessage }}</div>
    }
    @if (successMessage) {
      <div class="alert alert-success">{{ successMessage }}</div>
    }

    <form (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label class="form-label-login">Email</label>
        <input type="email" class="form-input-login" placeholder="ejemplo@correo.com" [(ngModel)]="email" name="email" />
      </div>

      <div class="mb-3">
        <label class="form-label-login">Contraseña</label>
        <input type="password" class="form-input-login" placeholder="••••••••" [(ngModel)]="password" name="password" />
      </div>

      <button class="btn-login w-100" type="submit" [disabled]="cargando()">
        @if (cargando()) {
          Cargando…
        } @else {
          Iniciar sesión
        }
      </button>
    </form>
  </div>
</div>
