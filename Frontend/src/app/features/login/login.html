<div class="login-page">
  <div class="login-card">
    <div class="login-logo">Librería Nazareth</div>
    <div class="login-subtitle">Sistema de gestión</div>

    @if (errorMessage) {
      <div class="alert alert-error">{{ errorMessage }}</div>
    }
    @if (successMessage) {
      <div class="alert alert-success">{{ successMessage }}</div>
    }

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="ejemplo@correo.com" [(ngModel)]="email" name="email" />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" placeholder="••••••••" [(ngModel)]="password" name="password" />
      </div>

      <button class="btn-login" type="submit" [disabled]="cargando()">
        @if (cargando()) {
          Cargando…
        } @else {
          Iniciar sesión
        }
      </button>
    </form>

  </div>
</div>
